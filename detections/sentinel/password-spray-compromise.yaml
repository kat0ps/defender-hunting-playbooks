# Sentinel scheduled analytics rule, converted from the Defender XDR rule in sourceRule.
# Terraform (lab/infra/terraform/modules/sentinel) turns this file into one
# azurerm_sentinel_alert_rule_scheduled resource. Every field is explained in schema.md.
id: 81d42c56-f7f7-52da-b703-49d9d26cf30e
name: "Password spray: spraying IP got a correct password"
description: |
  An IP that failed sign-ins against 10 or more users in the last 12 hours then entered a correct password
  for at least one account. Either it signed in, or only MFA or Conditional Access stopped it (error codes
  50074, 50076, 500121, 53003). Treat the account's password as known to the attacker.
  MITRE sub-techniques: T1110.003 (Brute Force: Password Spraying), T1078.004 (Valid Accounts: Cloud Accounts).
  Playbook: https://github.com/kat0ps/defender-hunting-playbooks/blob/main/playbooks/password-spray/README.md
severity: High
enabled: true
# Runs every 3 hours over 12 hours of failures (to spot the spray), but only alerts on correct-password
# events from the last 3 hours, so the same success isn't reported 4 times.
queryFrequency: PT3H
queryPeriod: PT12H
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: [CredentialAccess, InitialAccess]
techniques: [T1110, T1078]
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: UserId
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs, AADNonInteractiveUserSignInLogs]
requiredTables: [SigninLogs, AADNonInteractiveUserSignInLogs]
sourceRule: ../password-spray-compromise.kql
query: |
  // Tuning: raise minUsers in large tenants; exclude your own office egress IPs (shared NAT)
  let alertWindow = 3h;   // = queryFrequency. The 12h spray window comes from queryPeriod.
  let minUsers = 10;
  // No location/device fields needed here, so a plain union of the two sign-in tables is enough.
  let SignIns = union SigninLogs, AADNonInteractiveUserSignInLogs;
  let sprayIPs = SignIns
      // ResultType is a string in Sentinel, so the error codes are quoted.
      | where ResultType in ("50126", "50053", "50034")
      | summarize TargetedUsers = dcount(UserPrincipalName) by IPAddress
      | where TargetedUsers >= minUsers;
  SignIns
  | where TimeGenerated > ago(alertWindow)
  | where ResultType in ("0", "50074", "50076", "500121", "53003")
  | join kind=inner sprayIPs on IPAddress
  | extend Outcome = iff(ResultType == "0", "Signed in", "Password correct - stopped by MFA/CA")
  | summarize arg_max(TimeGenerated, ResultType, AppDisplayName), Outcomes = make_set(Outcome)
              by UserId, UserPrincipalName, IPAddress, TargetedUsers
  | project TimeGenerated, UserId, UserPrincipalName, IPAddress, TargetedUsers, Outcomes, ResultType, AppDisplayName
