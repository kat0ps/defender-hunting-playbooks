# Sentinel scheduled analytics rule, converted from the Defender XDR rule in sourceRule.
# Terraform (lab/infra/terraform/modules/sentinel) turns this file into one
# azurerm_sentinel_alert_rule_scheduled resource. Every field is explained in schema.md.
id: e70e5d29-c002-5cc8-a53e-6a9261615e28
name: "Impossible travel: successful sign-ins faster than 900 km/h apart"
description: |
  Two successful Entra ID sign-ins by the same user from different IPs whose distance and time gap
  imply travel faster than a commercial jet (900 km/h, minimum 500 km). Common causes are a stolen
  password or session token used from another country, or a VPN/proxy egress the rule doesn't know about.
  MITRE sub-techniques: T1078.004 (Valid Accounts: Cloud Accounts).
  Playbook: https://github.com/kat0ps/defender-hunting-playbooks/blob/main/playbooks/impossible-travel/README.md
severity: Medium
enabled: true
# Runs once a day over 2 days of data, so a pair of sign-ins either side of midnight is still compared.
# P1D is the same duration as PT24H. Use P1D because the Sentinel API returns durations in that form,
# and sending PT24H would make Terraform report a change on every plan.
queryFrequency: P1D
queryPeriod: P2D
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: [InitialAccess]
techniques: [T1078]
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: UserId
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ToIP
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: FromIP
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs, AADNonInteractiveUserSignInLogs]
requiredTables: [SigninLogs, AADNonInteractiveUserSignInLogs]
sourceRule: ../impossible-travel.kql
query: |
  // Tuning: add VPN/proxy egress ranges to excludedRanges; raise minDistanceKm if mobile carrier noise is high
  let maxSpeedKmh = 900;      // roughly commercial jet speed
  let minDistanceKm = 500;    // ignore small jumps caused by IP geolocation noise
  let excludedRanges = dynamic([]);   // e.g. dynamic(["203.0.113.0/24"])
  // The query reads 2 days (queryPeriod) but only alerts on hops that END in the last day
  // (queryFrequency). Without this, yesterday's hops would alert a second time today.
  let alertWindow = 1d;
  // Defender's EntraIdSignInEvents = SigninLogs (interactive) + AADNonInteractiveUserSignInLogs in Sentinel.
  // LocationDetails/DeviceDetail are dynamic in SigninLogs but JSON strings in the non-interactive
  // table, so parse_json() them there. Both legs end up with dynamic Loc/Dev columns.
  union
      (SigninLogs
          | extend Loc = LocationDetails, Dev = DeviceDetail),
      (AADNonInteractiveUserSignInLogs
          | extend Loc = parse_json(LocationDetails), Dev = parse_json(DeviceDetail))
  | where ResultType == "0"    // ErrorCode (int) -> ResultType (string): compare with "0", not 0
  | where array_length(excludedRanges) == 0 or not(ipv4_is_in_any_range(IPAddress, excludedRanges))
  | extend Lat = todouble(Loc.geoCoordinates.latitude), Lon = todouble(Loc.geoCoordinates.longitude),
           City = tostring(Loc.city), Country = tostring(Loc.countryOrRegion),
           OSPlatform = tostring(Dev.operatingSystem), Browser = tostring(Dev.browser),
           AadDeviceId = tostring(Dev.deviceId), IsManaged = tobool(Dev.isManaged), IsCompliant = tobool(Dev.isCompliant),
           // Defender's LogonType has no column in Sentinel; IsInteractive (bool) carries the same information.
           LogonType = iff(IsInteractive, "interactive", "nonInteractive")
  | where isnotnull(Lat) and isnotnull(Lon)
  | project TimeGenerated, UserPrincipalName, UserId, IPAddress, City, Country, Lat, Lon,
            AppDisplayName, ClientAppUsed, LogonType, UserAgent, OSPlatform, Browser,
            AadDeviceId, IsManaged, IsCompliant, SessionId
  | sort by UserId asc, TimeGenerated asc
  | extend PrevUser = prev(UserId), PrevTime = prev(TimeGenerated), PrevIP = prev(IPAddress),
           PrevCity = prev(City), PrevCountry = prev(Country), PrevLat = prev(Lat), PrevLon = prev(Lon),
           PrevApp = prev(AppDisplayName), PrevDevice = prev(AadDeviceId), PrevSession = prev(SessionId)
  | where UserId == PrevUser and IPAddress != PrevIP
  | extend DistanceKm = round(geo_distance_2points(PrevLon, PrevLat, Lon, Lat) / 1000.0, 0),
           HoursBetween = round((TimeGenerated - PrevTime) / 1h, 2)
  | where DistanceKm >= minDistanceKm
  | extend SpeedKmh = round(DistanceKm / max_of(HoursBetween, 0.01), 0)
  | where SpeedKmh > maxSpeedKmh
  | where TimeGenerated > ago(alertWindow)
  | extend SameDevice = isnotempty(AadDeviceId) and AadDeviceId == PrevDevice,
           SameSession = isnotempty(SessionId) and SessionId == PrevSession
  | project TimeGenerated, UserId, UserPrincipalName,
            FromTime = PrevTime, FromIP = PrevIP, FromLocation = strcat(PrevCity, ", ", PrevCountry), FromApp = PrevApp,
            ToIP = IPAddress, ToLocation = strcat(City, ", ", Country), ToApp = AppDisplayName,
            DistanceKm, HoursBetween, SpeedKmh, SameDevice, SameSession,
            LogonType, ClientAppUsed, OSPlatform, Browser, IsManaged, IsCompliant, UserAgent
  | sort by SpeedKmh desc
