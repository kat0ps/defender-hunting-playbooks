# Sentinel scheduled analytics rule, converted from the Defender XDR rule in sourceRule.
# Terraform (lab/infra/terraform/modules/sentinel) turns this file into one
# azurerm_sentinel_alert_rule_scheduled resource. Every field is explained in schema.md.
id: 4e1892cf-b203-55d4-87fb-283938705428
name: "AiTM: one sign-in session used from several countries and user agents"
description: |
  A single Entra ID sign-in session (SessionId) is used from more than one country and with more than one
  user agent in a day. A legitimate session stays on one device. When the same session shows up from a
  different country and browser, the session cookie has most likely been stolen and replayed.
  MITRE sub-techniques: T1550.004 (Use Alternate Authentication Material: Web Session Cookie).
  Playbook: https://github.com/kat0ps/defender-hunting-playbooks/blob/main/playbooks/aitm-token-theft/README.md
severity: High
enabled: true
queryFrequency: P1D    # = PT24H, written the way the Sentinel API returns it (avoids Terraform drift)
queryPeriod: P1D
triggerOperator: GreaterThan
triggerThreshold: 0
tactics: [CredentialAccess, DefenseEvasion]
techniques: [T1539, T1550]
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: UserId
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs, AADNonInteractiveUserSignInLogs]
requiredTables: [SigninLogs, AADNonInteractiveUserSignInLogs]
sourceRule: ../aitm-session-replay-useragent-change.kql
query: |
  // Tuning: travelling users on VPNs can trigger the country part; the user-agent change is what makes it high-fidelity
  // No ago() filter: Sentinel already limits the query to queryPeriod (1 day).
  union
      (SigninLogs
          | extend Loc = LocationDetails),
      (AADNonInteractiveUserSignInLogs
          | extend Loc = parse_json(LocationDetails))    // JSON string in this table
  | where ResultType == "0" and isnotempty(SessionId)
  | extend Country = tostring(Loc.countryOrRegion)
  // dcountif(..., isnotempty()) instead of dcount(): some sign-ins have no location, and an empty
  // Country would otherwise count as a second "country".
  | summarize arg_max(TimeGenerated, IPAddress),
              CountryCount = dcountif(Country, isnotempty(Country)), Countries = make_set(Country, 10),
              UADistinct = dcountif(UserAgent, isnotempty(UserAgent)), UserAgents = make_set(UserAgent, 5),
              IPs = make_set(IPAddress, 20)
              by UserId, UserPrincipalName, SessionId
  | where CountryCount > 1 and UADistinct > 1
  | project TimeGenerated, UserId, UserPrincipalName, SessionId, IPAddress, Countries, UserAgents, IPs
